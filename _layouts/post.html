<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} — Resilience Node</title>
  <style>
    :root { --bg: #09090b; --card: #121216; --border: #27272a; --text: #f4f4f5; --muted: #a1a1aa; --accent: #38bdf8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; line-height: 1.7; padding: 2rem 1.25rem; max-width: 760px; margin: 0 auto; }
    header { border-bottom: 1px solid var(--border); padding-bottom: 1.25rem; margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 1.15rem; font-weight: 700; color: var(--text); text-decoration: none; }
    .brand span { color: var(--accent); }
    .back { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
    .back:hover { color: var(--text); }
    .meta { color: var(--accent); font-size: 0.85rem; margin-bottom: 0.5rem; font-family: monospace; }
    h1 { font-size: 1.85rem; line-height: 1.25; margin-bottom: 1.5rem; }
    article p { margin-bottom: 1.15rem; color: #e4e4e7; }
    article h2 { font-size: 1.25rem; margin: 2rem 0 0.75rem; color: var(--text); }
    article h3 { font-size: 1.05rem; margin: 1.5rem 0 0.5rem; color: var(--text); }
    article ul, article ol { margin: 0 0 1.15rem 1.5rem; color: #e4e4e7; }
    article li { margin-bottom: 0.4rem; }
    article code { background: var(--card); border: 1px solid var(--border); padding: 0.15rem 0.35rem; border-radius: 4px; font-size: 0.88rem; }
    article pre { background: var(--card); border: 1px solid var(--border); padding: 1rem; border-radius: 8px; overflow-x: auto; margin-bottom: 1.25rem; }
    article pre code { border: none; padding: 0; }
    article img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); margin: 1rem 0; }
    article a { color: var(--accent); text-decoration: none; }
    article blockquote { border-left: 3px solid var(--accent); padding-left: 1rem; color: var(--muted); margin-bottom: 1.15rem; }
    footer { border-top: 1px solid var(--border); padding-top: 1.5rem; margin-top: 3rem; font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <header>
    <a href="/" class="brand">Resilience<span>Node</span></a>
    <a href="/" class="back">← Back to Home</a>
  </header>
  <main>
    <div class="meta">{{ page.date | date: "%Y-%m-%d" }}</div>
    <h1>{{ page.title }}</h1>
    <article>{{ content }}</article>
  </main>
  <footer>
    <span>© 2026 Resilience Node</span>
    <span>Odesa, Ukraine</span>
  </footer>
</body>
</html>
