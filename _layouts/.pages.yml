media: assets/images
content:
  - name: posts
    label: Research & Notes
    type: collection
    path: _posts
    filename: "{fields.date}-{primary}.md"
    fields:
      - name: layout
        label: Layout
        type: string
        default: post
        hidden: true
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: summary
        label: Summary
        type: text
      - name: body
        label: Content
        type: rich-text
        
